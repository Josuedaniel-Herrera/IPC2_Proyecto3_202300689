<!DOCTYPE html>
<html>
<head>
    <title>Resumen IVA</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Resumen de IVA por NIT Emisor</h1>
    <div style="width: 800px;">
        <canvas id="graficaIVA"></canvas>
    </div>

    <!-- Convertir datos a JSON de forma segura -->
    {{ iva_emisores|json_script:"iva-data" }}
    
    <script>
        // Leer datos desde el script generado por Django
        const ivaEmisores = JSON.parse(document.getElementById('iva-data').textContent);
        const ctx = document.getElementById('graficaIVA');
        
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: Object.keys(ivaEmisores),
                datasets: [{
                    label: 'IVA por Emisor',
                    data: Object.values(ivaEmisores),
                    backgroundColor: 'rgba(75, 192, 192, 0.2)'
                }]
            }
        });
    </script>
</body>
</html>
