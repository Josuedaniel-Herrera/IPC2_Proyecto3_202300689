<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}DTE Service{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'index' %}">DTE Service</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="{% url 'index' %}">Cargar XML</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'consultar' %}">Consultar</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'summary_iva' %}">Resumen IVA</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'summary_rango' %}">Resumen Rango</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'report_pdf' %}">Reporte PDF</a></li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Ayuda</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="{% url 'student_info' %}">Información Estudiante</a></li>
            <li><a class="dropdown-item" href="{% url 'program_doc' %}">Documentación Programa</a></li>
          </ul>
        </li>
        <li class="nav-item"><a class="nav-link" href="{% url 'reset' %}">Reset API</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
